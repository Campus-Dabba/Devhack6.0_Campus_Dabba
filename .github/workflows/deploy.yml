# Builds the Next.js app in GitHub Actions and pushes it to Netlify.
# Netlify never pulls from the org repo, so the "organization repository" block doesn't apply.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   NETLIFY_AUTH_TOKEN  - Netlify personal access token (User settings -> Applications)
#   NETLIFY_SITE_ID     - Site ID of the campusdabba0 site (Site configuration -> General)
#
# Server-side env vars (Razorpay, Gemini, Supabase service role, ...) stay in the
# Netlify site's environment settings; `netlify build` pulls them in automatically.

name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@23.13.0

      # Next.js has API routes + middleware, so it is not a plain static export.
      # `netlify build` runs @netlify/plugin-nextjs, which packages the server
      # functions; `netlify deploy` then uploads the finished output.
      - name: Build with Netlify
        run: netlify build

      - name: Deploy preview (pull requests)
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          netlify deploy --no-build --alias "pr-${{ github.event.number }}" --json > deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Netlify preview: ${{ steps.preview.outputs.url }}`,
            })

      - name: Deploy to production
        if: github.event_name != 'pull_request'
        run: netlify deploy --no-build --prod
